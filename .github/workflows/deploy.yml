name: Deploy to GitHub Pages

# Runs every time you push a commit to the main branch
on:
  push:
    branches:
      - main

# Allow the workflow to write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Step 1: Download your code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Tell GitHub Pages which folder to publish (root of the repo)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Step 3: Upload the files to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # the root folder contains index.html, style.css, script.js

      # Step 4: Actually deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
